<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <!-- AJUSTE PARA CELULAR -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- COR DO APLICATIVO -->
  <meta
    name="theme-color"
    content="#1f5f46"
  >

  <!-- CONFIGURAÇÕES PARA IPHONE / IOS -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Hora-Atividade"
  >

  <!-- NOME DO APLICATIVO -->
  <title>Hora-Atividade</title>

  <!-- ÍCONE PARA IPHONE / IPAD -->
  <link
    rel="apple-touch-icon"
    href="./app-hora-atividade.png"
  >

  <!-- ÍCONE NORMAL -->
  <link
    rel="icon"
    type="image/png"
    href="./app-hora-atividade.png"
  >

  <!-- MANIFESTO DO APLICATIVO -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f6f8;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f4f6f8;
      overflow: hidden;
    }

    #app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      width: 100%;
      height: 100%;

      background: #f4f6f8;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;

      border: 0;

      width: 100%;
      height: 100%;

      display: block;

      background: #f4f6f8;
    }
  </style>

</head>

<body>

  <div id="app">

    <iframe
      src="https://script.google.com/macros/s/AKfycbw2V1nGS3e6e5evQcXwoS1od5oZ2LU4qCWpnYlXMV1hNzHFCwqsmh2syBbwsXhCN3AN/exec"
      allow="clipboard-write"
      title="Hora-Atividade"
    ></iframe>

  </div>

</body>

</html>
