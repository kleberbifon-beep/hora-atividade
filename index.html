<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#1f5f46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hora-Atividade">
  <title>Hora-Atividade</title>
  <link rel="apple-touch-icon" href="./app-hora-atividade.png">
  <link rel="icon" type="image/png" href="./app-hora-atividade.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    *{box-sizing:border-box}
    html,body,#app{margin:0;width:100%;height:100%;background:#f4f6f8}
    body{overflow:hidden}
    #app{position:fixed;inset:0}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f4f6f8;display:block}
    #erro{
      display:none;
      min-height:100%;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,Helvetica,sans-serif;
      color:#455a64;
      text-align:center;
    }
  </style>
</head>
<body>
  <div id="app">
    <iframe id="frameApp" allow="clipboard-write" title="Hora-Atividade"></iframe>
    <div id="erro">
      <div>
        <h2>Hora-Atividade</h2>
        <p>Esta instalação ainda não foi vinculada a um Web App.</p>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const exec = params.get("exec");

      if(exec){
        try{
          const u = new URL(exec);
          if(
            u.protocol === "https:" &&
            u.hostname === "script.google.com"
          ){
            localStorage.setItem("hora_atividade_exec", exec);
          }
        }catch(_){}
      }

      const alvo =
        exec ||
        localStorage.getItem("hora_atividade_exec") ||
        "";

      const frame = document.getElementById("frameApp");
      const erro = document.getElementById("erro");

      if(alvo){
        frame.src = alvo;
      }else{
        frame.style.display = "none";
        erro.style.display = "flex";
      }
    })();
  </script>
</body>
</html>
